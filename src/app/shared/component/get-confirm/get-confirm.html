<mat-card>
    <mat-card-content>
        <p>{{msg || 'Are you sure ?'}}</p>
         <div class="d-flex justify-content-between">
            <button class="btn btn-sm btn-primary" (click)="onClick(false)">No</button>
            <button class="btn btn-sm btn-danger"  (click)="onClick(true)">Yes</button>
         </div>
    </mat-card-content>
</mat-card>
